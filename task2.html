<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Задание 2</title>
</head>
<body>
    <h1>1. Определение месяца</h1>
    <button onCLick="printMonth()">Введите номер месяца</button>
    <script src="script.js"></script>

    <h1>2. Печать n простых чисел</h1>
    <button onCLick="printPrimeNumbers()">Введите число n</button>
    <script src="script.js"></script>

    <h1>3. Увеличение/уменьшение счетчика</h1>
    <button onCLick="changeCounter()">Изменить счетчик</button>
    <script src="script.js"></script>

    <h1>4. Замена запятых на точки</h1>
    <button onCLick="changeCommaToPoint()">Введите список слов через запятую</button>
    <script src="script.js"></script>
    
    <h1>5. Проверка, является ли строка палиндромом</h1>
    <button onCLick="isPalindrom()">Введите строку для проверки</button>
    <script src="script.js"></script>
</body>    
</html>
